# ============================================================
#  SLAM Toolbox - Async Mapping Mode
#  Dùng cho: vẽ bản đồ + định vị đồng thời (SLAM)
# ============================================================

slam_toolbox:
  ros__parameters:
    # Plugin / mode
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frames
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping   # hoặc "localization" sau khi có map

    # Sim time
    use_sim_time: true

    # Map update
    map_update_interval: 1.0       # giây
    resolution: 0.03               # 3 cm/ô
    max_laser_range: 3.5           # khớp với LIDAR range
    minimum_time_interval: 0.2

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: false
    minimum_travel_distance: 0.05  # m
    minimum_travel_heading: 0.08   # rad
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 4.0
    link_match_minimum_response_fine: 0.50
    distance_variance_penalty: 1.0
    angle_variance_penalty: 2.0

    # Loop closure
    do_loop_closing: false
    loop_search_space_dimension: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.55
    loop_match_minimum_response_fine: 0.65

    # Correlation parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.05

    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Throttle
    throttle_scans: 1
    transform_publish_period: 0.01
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
